<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · KaNun Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/auth.css" />
  <style>
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 28px; background:#fff; border-bottom:1px solid var(--line); }
    .topbar .wordmark { color: var(--green-900); }
    .topbar .wordmark .mark { background: var(--green-050); }
    .topbar .wordmark .mark svg { stroke: var(--green-700); }
    .userchip { display:flex; align-items:center; gap:12px; }
    .userchip .who { text-align:right; line-height:1.25; }
    .userchip .who .name { font-size:14px; font-weight:600; }
    .userchip .who .email { font-size:12px; color:var(--ink-soft); }
    .avatar { width:38px; height:38px; border-radius:50%; background:var(--green-700); color:#fff; display:grid; place-items:center; font-weight:600; font-size:15px; }
    .btn-logout { width:auto; padding:9px 16px; font-size:13px; }
    .page { max-width:960px; margin:0 auto; padding:40px 28px; }
    .welcome { font-size:26px; font-weight:700; letter-spacing:-.02em; margin:0 0 6px; }
    .welcome-sub { color:var(--ink-soft); margin:0 0 32px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:28px; }
    .tile { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
    .tile h3 { margin:0 0 4px; font-size:15px; }
    .tile p { margin:0; color:var(--ink-soft); font-size:13px; }
    .tile .big { font-size:30px; font-weight:700; color:var(--green-700); letter-spacing:-.02em; }
    .session-card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow); }
    .session-card h3 { margin:0 0 14px; font-size:15px; }
    .kv { display:grid; grid-template-columns:160px 1fr; gap:8px 16px; font-size:13px; }
    .kv dt { color:var(--ink-soft); }
    .kv dd { margin:0; font-family:'JetBrains Mono', ui-monospace, monospace; word-break:break-all; }
    .loading { display:grid; place-items:center; min-height:100vh; color:var(--ink-soft); }
    @media (max-width:560px){ .userchip .who{ display:none; } }
  </style>
</head>
<body>
  <div id="root"><div class="loading">Loading…</div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/assets/config.js"></script>
  <script src="/assets/auth.js"></script>
  <script>
    (async () => {
      const session = await requireSession()
      if (!session) return
      const user = session.user
      const meta = user.user_metadata || {}
      const name = meta.full_name || meta.name || user.email.split('@')[0]
      const initials = name.split(/\s+/).map(s => s[0]).slice(0,2).join('').toUpperCase()
      const provider = (user.app_metadata && user.app_metadata.provider) || 'email'
      const created = user.created_at ? new Date(user.created_at).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) : '—'

      document.getElementById('root').innerHTML = `
        <header class="topbar">
          <a href="/" class="wordmark">
            <span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
            KaNun Monitoring
          </a>
          <div class="userchip">
            <div class="who"><div class="name">${name}</div><div class="email">${user.email}</div></div>
            <div class="avatar">${initials}</div>
            <button class="btn btn-ghost btn-logout" id="logoutBtn">Sign out</button>
          </div>
        </header>

        <main class="page">
          <h1 class="welcome">Welcome back, ${name.split(' ')[0]}.</h1>
          <p class="welcome-sub">You're signed in to the KaNun Monitoring demo environment.</p>

          <div class="grid">
            <div class="tile"><div class="big">0</div><h3>Active cases</h3><p>No cases assigned yet.</p></div>
            <div class="tile"><div class="big">0</div><h3>Upcoming visits</h3><p>Nothing scheduled.</p></div>
            <div class="tile"><div class="big">0</div><h3>Reports due</h3><p>You're all caught up.</p></div>
          </div>

          <div class="session-card">
            <h3>Your session</h3>
            <dl class="kv">
              <dt>Signed in as</dt><dd>${user.email}</dd>
              <dt>Display name</dt><dd>${name}</dd>
              <dt>Sign-in method</dt><dd>${provider}</dd>
              <dt>Account created</dt><dd>${created}</dd>
              <dt>User ID</dt><dd>${user.id}</dd>
            </dl>
          </div>
        </main>`

      document.getElementById('logoutBtn').onclick = async () => {
        await sb.auth.signOut()
        window.location.replace('/login.html')
      }

      // If the session ends (e.g. in another tab), bounce to login.
      sb.auth.onAuthStateChange((event) => {
        if (event === 'SIGNED_OUT') window.location.replace('/login.html')
      })
    })()
  </script>
</body>
</html>
