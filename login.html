<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · KaNun Monitoring</title>
  <meta name="description" content="Sign in to KaNun Monitoring." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/auth.css" />
</head>
<body>
  <div class="auth-wrap" id="wrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/assets/config.js"></script>
  <script src="/assets/auth.js"></script>
  <script>
    document.getElementById('wrap').innerHTML = brandPane() + `
      <div class="form-pane">
        <div class="card">
          <h2>Sign in</h2>
          <p class="sub">Welcome back to KaNun Monitoring.</p>

          <div class="msg" id="msg"></div>

          <div class="social-row">
            <button class="btn btn-social" id="googleBtn" type="button">${GOOGLE_SVG} Google</button>
            <button class="btn btn-social" id="facebookBtn" type="button">${FACEBOOK_SVG} Facebook</button>
          </div>

          <div class="divider">or</div>

          <div class="tabs">
            <button id="tabPassword" class="active" type="button">Password</button>
            <button id="tabMagic" type="button">Magic link</button>
          </div>

          <!-- Password form -->
          <form id="passwordForm">
            <div class="field">
              <label for="pwEmail">Email</label>
              <input id="pwEmail" type="email" autocomplete="username" placeholder="you@agency.com" required />
            </div>
            <div class="field">
              <div class="label-row">
                <label for="pwPass">Password</label>
                <a href="/forgot.html">Forgot password?</a>
              </div>
              <input id="pwPass" type="password" autocomplete="current-password" placeholder="••••••••" required />
            </div>
            <button class="btn btn-primary" id="pwBtn" type="submit">Sign in</button>
          </form>

          <!-- Magic link form -->
          <form id="magicForm" style="display:none">
            <div class="field">
              <label for="mlEmail">Email</label>
              <input id="mlEmail" type="email" autocomplete="username" placeholder="you@agency.com" required />
            </div>
            <button class="btn btn-primary" id="mlBtn" type="submit">Send magic link</button>
            <p class="sub mt-2" style="margin-bottom:0">We'll email you a secure link to sign in — no password needed.</p>
          </form>

          <p class="foot-note">New to KaNun Monitoring? <a href="/signup.html">Create an account</a></p>
        </div>
      </div>`

    const msg = document.getElementById('msg')
    redirectIfAuthed()

    // Tabs
    const tabPassword = document.getElementById('tabPassword')
    const tabMagic = document.getElementById('tabMagic')
    const passwordForm = document.getElementById('passwordForm')
    const magicForm = document.getElementById('magicForm')
    tabPassword.onclick = () => {
      tabPassword.classList.add('active'); tabMagic.classList.remove('active')
      passwordForm.style.display = ''; magicForm.style.display = 'none'; clearMsg(msg)
    }
    tabMagic.onclick = () => {
      tabMagic.classList.add('active'); tabPassword.classList.remove('active')
      magicForm.style.display = ''; passwordForm.style.display = 'none'; clearMsg(msg)
    }

    // Social
    document.getElementById('googleBtn').onclick = () => socialSignIn('google', msg)
    document.getElementById('facebookBtn').onclick = () => socialSignIn('facebook', msg)

    // Password sign-in
    passwordForm.onsubmit = async (e) => {
      e.preventDefault(); clearMsg(msg)
      const btn = document.getElementById('pwBtn'); setBusy(btn, true, 'Signing in…')
      const email = document.getElementById('pwEmail').value.trim()
      const password = document.getElementById('pwPass').value
      const { error } = await sb.auth.signInWithPassword({ email, password })
      if (error) { showMsg(msg, friendlyError(error)); setBusy(btn, false); return }
      window.location.replace(window.APP_REDIRECT)
    }

    // Magic link
    magicForm.onsubmit = async (e) => {
      e.preventDefault(); clearMsg(msg)
      const btn = document.getElementById('mlBtn'); setBusy(btn, true, 'Sending…')
      const email = document.getElementById('mlEmail').value.trim()
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.origin + window.APP_REDIRECT },
      })
      setBusy(btn, false)
      if (error) { showMsg(msg, friendlyError(error)); return }
      showMsg(msg, `Check ${email} for a sign-in link. It may take a minute to arrive.`, 'ok')
      magicForm.reset()
    }
  </script>
</body>
</html>
