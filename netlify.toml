# KaNun Monitoring — static auth site + Stripe checkout API (Netlify Functions).
[build]
  publish = "."
  functions = "netlify/functions"

# Allow extensionless URLs (/login -> /login.html, etc.)
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200
[[redirects]]
  from = "/forgot"
  to = "/forgot.html"
  status = 200
[[redirects]]
  from = "/reset"
  to = "/reset.html"
  status = 200
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
